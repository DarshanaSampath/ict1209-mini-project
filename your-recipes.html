<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Recipe - The Cooking Recipe Hub</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <header id="navbar-placeholder">
        <!-- Bootstrap 5 Navbar -->
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container">
                <a class="navbar-brand fw-bold" href="index.html">🍽️The Cooking Recipe Hub</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                        <li class="nav-item"><a class="nav-link" href="recipes.html">Recipes</a></li>
                        <li class="nav-item"><a class="nav-link active text-warning fw-bold" href="your-recipes.html">Your Recipes</a></li>
                        <li class="nav-item"><a class="nav-link" href="about.html">About Us</a></li>
                        <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="about-text-container mb-5">
                    <h1 class="mb-3 fw-bold">ඔබේ කෑම වට්ටෝරුව එකතු කරන්න</h1>
                    <h6 class="text-muted">Submit your own traditional or modern recipe to share with our community!</h6>
                </div>
                <div class="card submit-card p-5 border bg-white">
                    <form id="recipeForm">
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-bold">වට්ටෝරුවේ නම (Recipe Name)</label>
                                <input type="text" class="form-control" placeholder="e.g., Spicy Chicken Curry" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">වර්ගය (Category)</label>
                                <select class="form-select" required>
                                    <option value="">Select Category...</option>
                                    <option value="breakfast">Breakfast</option>
                                    <option value="brunch">Brunch</option>
                                    <option value="lunch">Lunch</option>
                                    <option value="dinner">Dinner</option>
                                    <option value="snack">Snack</option>
                                    <option value="dessert">Dessert</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">අවශ්‍ය ද්‍රව්‍ය (Ingredients)</label>
                            <textarea class="form-control" rows="4" placeholder="List the ingredients separated by commas..." required></textarea>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">සාදන ආකාරය (Instructions)</label>
                            <textarea class="form-control" rows="5" placeholder="Explain how to cook this recipe step by step..." required></textarea>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold">පින්තූරයක් (Upload Image)</label>
                            <input class="form-control" type="file" accept="image/*" required>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 fw-bold py-2">Submit Recipe</button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <!-- Bootstrap 5 Footer -->
    <footer class="bg-dark text-white text-center py-4 mt-auto">
        <div class="container">
            <p class="mb-0">&copy; 2026 The Cooking Recipe Hub. All rights reserved.</p>
        </div>
    </footer>

    <!-- Bootstrap 5 javascript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
